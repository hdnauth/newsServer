  - key: india
    label: 인도
    terms: [인도 증시, 인도 경제, 인도 정부, 인도 중앙은행, 인도중앙은행, 인도 루피, 인도 시장,
            인도 총리, 니프티50, 센섹스, 뭄바이, India, Indian, Nifty 50, Sensex, rupee]
  - key: vietnam
    label: 베트남
    terms: [베트남, 하노이, 호찌민, Vietnam, Vietnamese]
    cs_terms: [VN30]

