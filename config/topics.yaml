# 주제 태깅 규칙 — 규칙을 바꾸면 version 을 올릴 것 (서버가 보관 중인 기사를 재태깅한다)
#
#   terms    : 대소문자 무시. 영숫자로 시작/끝나면 영숫자 경계 필요, 공백은 0개 이상 공백과 매칭
#   cs_terms : 대소문자 구분 (소문자일 때 다른 뜻인 약어)
#   not_terms: (name_hints 전용) 이름에 이것이 있으면 그 힌트를 적용하지 않는다
version: 2

topics:
  # ── 지수 ──
  - key: kospi
    label: 코스피
    terms: [코스피, KOSPI, 국내 증시, 유가증권시장]
  - key: kosdaq
    label: 코스닥
    terms: [코스닥, KOSDAQ]
  - key: sp500
    label: S&P500
    terms: [S&P 500, 에스앤피, 스탠더드앤드푸어스]
  - key: nasdaq
    label: 나스닥
    terms: [나스닥, Nasdaq]
  - key: dow
    label: 다우
    terms: [다우존스, 다우 지수, 다우산업, Dow Jones]

  # ── 섹터·테마 ──
  - key: semiconductor
    label: 반도체
    terms: [반도체, 파운드리, HBM, semiconductor, semiconductors, chipmaker, chipmakers, foundry, Nvidia, 엔비디아]
  - key: bigtech
    label: 빅테크
    terms: [빅테크, big tech, 애플, Apple, 마이크로소프트, Microsoft, 구글, Google, Alphabet, 아마존, Amazon, 메타플랫폼스]
    cs_terms: [Meta]
  - key: ai
    label: AI
    terms: [인공지능, 생성형, 챗GPT, ChatGPT, OpenAI, artificial intelligence]
    cs_terms: [AI]
  - key: battery
    label: 2차전지
    terms: [2차전지, 이차전지, 배터리, 양극재, 음극재, 리튬, battery, batteries, lithium]
  - key: bio
    label: 바이오·제약
    terms: [바이오, 제약, 신약, 임상, biotech, pharma, pharmaceutical, pharmaceuticals]
    cs_terms: [FDA]
  - key: realestate
    label: 부동산
    terms: [부동산, 아파트값, 집값, 주택가격, 리츠, REIT, REITs, real estate, housing market]
  - key: crypto
    label: 가상자산
    terms: [비트코인, 가상자산, 암호화폐, 가상화폐, 이더리움, 스테이블코인, Bitcoin, crypto, cryptocurrency, Ethereum, stablecoin]

  # 테마 ETF 용 — 섹터·지수 주제만으로는 방산·원전·우주 같은 테마 상품이 주제를 하나도
  # 받지 못했다(실측 보유 ETF 26종 중 15종). 한국어 단어에는 경계가 없으므로
  # 다른 뜻과 겹치는 짧은 단어는 넣지 않는다 — 「양자」(양자 회담)·「인도」(원유 ○월 인도분)
  # ·「무기」(무기한)·「니프티」(니프티 피프티).
  - key: defense
    label: 방산
    terms: [방산, 방위산업, 방위사업, 국방, 미사일, 전투기, 자주포, 무기 수출, defense, defence,
            Pentagon, 펜타곤, Lockheed, 록히드마틴, 록히드 마틴, Northrop, Raytheon]
  - key: nuclear
    label: 원전
    terms: [원전, 원자력, 소형모듈원자로, 우라늄, 핵연료, nuclear power, nuclear energy,
            nuclear reactor, nuclear reactors, uranium]
