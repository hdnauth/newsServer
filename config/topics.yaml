  - key: oil
    label: 유가
    terms: [유가, 원유, 석유, 브렌트, OPEC, crude, WTI, Brent]
  - key: dividend
    label: 배당
    terms: [배당, 분배금, 배당락, dividend, dividends]
  - key: inflation
    label: 물가
    terms: [물가, 소비자물가, 인플레이션, 디플레이션, inflation, deflation, CPI, PCE]
  - key: etf
