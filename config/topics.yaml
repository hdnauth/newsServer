    terms: [ETF, ETFs, 상장지수펀드]

  # ── 지역 ──
  - key: china
    label: 중국
    terms: [중국, 차이나, 항셍, 위안화, China, Chinese, Hang Seng, yuan]
  - key: japan
    label: 일본
    terms: [일본, 닛케이, 엔화, Japan, Japanese, Nikkei, yen]
