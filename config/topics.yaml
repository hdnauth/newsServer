  - key: quantum
    label: 양자컴퓨팅
    terms: [양자컴퓨팅, 양자컴퓨터, 양자기술, 양자암호, quantum computing, quantum computer,
            quantum computers, IonQ, 아이온큐, Rigetti]
  - key: cleanenergy
    label: 클린에너지
    terms: [신재생, 재생에너지, 태양광, 풍력, 수소경제, 친환경 에너지, 클린에너지, clean energy,
            renewable, renewables, solar, wind power, hydrogen]
  - key: ev
    label: 전기차
    terms: [전기차, 테슬라, Tesla, 자율주행, 로보택시, robotaxi, electric vehicle, electric vehicles]
    cs_terms: [EV, EVs]
  - key: power
    label: 전력·인프라
    terms: [전력망, 전력 수요, 전력 인프라, 전력기기, 송전, 변압기, power grid, electricity demand,
            utilities]
  - key: valueup
    label: 밸류업
    terms: [밸류업, 기업가치 제고, 주주환원, value-up]

  # ── 거시·자산 ──
  - key: bond
    label: 채권·금리
    terms: [채권, 국채, 금리, 기준금리, 수익률 곡선, 연준, FOMC, Treasury, Treasuries, yield, yields, bond, bonds]
