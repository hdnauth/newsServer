[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsclient"
version = "0.1.0"
description = "NewsServer HTTP client (async/sync, fail-soft)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["newsclient"]
