[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsserver"
version = "0.1.0"
description = "Local news & disclosure aggregation server — collect once, serve over HTTP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["newsserver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
